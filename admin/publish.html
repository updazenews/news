<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publish Article | Updaze News Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="admin-shell">
  <header class="bg-white border-bottom sticky-top">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">Publish Article</h1>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-primary btn-sm" href="/admin/index.html">Dashboard</a>
        <span id="adminUserLabel" class="small text-muted"></span>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <div id="guardMessage" class="alert alert-warning d-none" role="alert"></div>

    <section class="card admin-panel p-4 mb-4">
      <h2 class="h5">Publish Article</h2>
      <p class="text-muted">Publishing stores article metadata in Firestore and makes the article available on your GitHub-hosted site via <code>article.html?slug=[slug]</code>.</p>
      <form id="publishForm" class="row g-3">
        <div class="col-md-8">
          <label class="form-label" for="title">Title</label>
          <input class="form-control" id="title" required />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="category">Category</label>
          <select id="category" class="form-select" required>
            <option value="">Select category</option>
            <option>breaking-news</option>
            <option>politics</option>
            <option>business</option>
            <option>technology</option>
            <option>sports</option>
            <option>entertainment</option>
            <option>health</option>
            <option>world</option>
            <option>opinion</option>
            <option>editorials</option>
            <option>interviews</option>
            <option>podcasts</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="author">Author</label>
          <input class="form-control" id="author" required />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="imageUrl">Feature image URL (optional)</label>
          <input class="form-control" id="imageUrl" type="url" placeholder="https://" />
        </div>
        <div class="col-12">
          <label class="form-label" for="excerpt">Excerpt</label>
          <textarea id="excerpt" class="form-control" rows="2" required></textarea>
        </div>
        <div class="col-12">
          <label class="form-label" for="content">Article Content</label>
          <textarea id="content" class="form-control" rows="8" required></textarea>
        </div>
        <div class="col-12 d-flex gap-2">
          <button class="btn btn-primary" type="submit">Publish</button>
          <button id="previewBtn" class="btn btn-outline-secondary" type="button">Preview</button>
        </div>
      </form>
      <p id="publishMessage" class="mt-3 mb-0 small"></p>
    </section>

    <section class="card admin-panel p-4">
      <h2 class="h5">Live Preview</h2>
      <article id="previewPane" class="editor-preview" aria-live="polite">
        Fill in the form and click Preview to render article output.
      </article>
    </section>
  </main>

  <script type="module" src="../assets/js/publish.js"></script>
</body>
</html>
