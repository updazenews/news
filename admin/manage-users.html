<body class="admin-shell">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M42THLLQ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main class="container-fluid py-3">
    <div class="row g-3">
      <aside class="col-12 col-lg-3 col-xl-2">
        <div class="card admin-panel p-3">
          <h1 class="h5 mb-3 d-flex align-items-center gap-2"><img src="https://res.cloudinary.com/dtrvtmpu5/image/upload/v1771616097/page_logo_s3j3kg.png" alt="Updaze News logo" class="site-logo" /> <span>Updaze Admin</span></h1>
          <nav class="nav flex-column gap-1">
            <a class="nav-link" href="/admin/index.html">Dashboard</a>
            <a class="nav-link" href="/admin/my-articles.html">My Articles</a>
            <a class="nav-link" href="/admin/publish.html">Publish Article</a>
            <a class="nav-link" href="/admin/account.html">Manage My Account</a>
            <a id="manageUsersLink" class="nav-link active" href="/admin/manage-users.html">Manage Users</a>
          </nav>
          <hr />
          <p id="adminUserLabel" class="small text-muted mb-2"></p>
          <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button">Logout</button>
        </div>
      </aside>

      <section class="col-12 col-lg-9 col-xl-10">
        <div id="guardMessage" class="alert alert-warning d-none" role="alert"></div>

        <section class="card admin-panel p-4 mb-3">
          <h2 class="h5 mb-3">Add User</h2>
          <form id="addUserForm" class="row g-3" novalidate>
            <div class="col-md-6">
              <label class="form-label" for="newUserName">Name</label>
              <input id="newUserName" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="newUserEmail">Email</label>
              <input id="newUserEmail" type="email" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="newUserCellphone">Cellphone</label>
              <input id="newUserCellphone" class="form-control" />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="newUserRole">Role</label>
              <select id="newUserRole" class="form-select" required>
                <option value="publisher">publisher</option>
                <option value="editor">editor</option>
                <option value="admin">admin</option>
                <option value="super admin">super admin</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="newUserPassword">Temporary Password</label>
              <input id="newUserPassword" type="password" minlength="6" class="form-control" required />
            </div>
            <div class="col-12 d-flex gap-2 align-items-center">
              <button id="addUserBtn" class="btn btn-primary" type="submit">Add User</button>
              <span id="addUserMessage" class="small" role="status" aria-live="polite"></span>
            </div>
          </form>
        </section>

        <section class="card admin-panel p-4">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0">User Management</h2>
            <button id="refreshUsersBtn" class="btn btn-outline-secondary btn-sm" type="button">Refresh</button>
          </div>
          <div class="table-responsive mt-3">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Cellphone</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr><td colspan="6">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </div>
  </main>

  <script type="module" src="../assets/js/manage-users.js"></script>
  <script src="../assets/js/cookie-consent.js"></script>
</body>
</html>
