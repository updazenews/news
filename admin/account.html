  <main class="container-fluid py-3">
    <div class="row g-3">
      <aside class="col-12 col-lg-3 col-xl-2">
        <div class="card admin-panel p-3">
          <h1 class="h5 mb-3">Admin</h1>
          <nav class="nav flex-column gap-1">
            <a class="nav-link" href="/admin/index.html">Dashboard</a>
            <a class="nav-link" href="/admin/my-articles.html">My Articles</a>
            <a class="nav-link" href="/admin/publish.html">Publish Article</a>
            <a class="nav-link active" href="/admin/account.html">Manage My Account</a>
            <a id="manageUsersLink" class="nav-link d-none" href="/admin/manage-users.html">Manage Users</a>
          </nav>
          <hr />
          <p id="adminUserLabel" class="small text-muted mb-2"></p>
          <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button">Logout</button>
        </div>
      </aside>

      <section class="col-12 col-lg-9 col-xl-10">
        <div id="guardMessage" class="alert alert-warning d-none" role="alert"></div>
        <section class="card admin-panel p-4">
          <h2 class="h5">Manage My Account</h2>
          <form id="accountForm" class="row g-3" novalidate>
            <div class="col-md-6">
              <label class="form-label" for="displayName">Name</label>
              <input id="displayName" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="cellphone">Cellphone</label>
              <input id="cellphone" class="form-control" placeholder="e.g. +27..." />
            </div>
            <div class="col-12">
              <button id="saveProfileBtn" class="btn btn-primary" type="submit">Save Profile</button>
            </div>
          </form>
          <p id="accountMessage" class="small mt-3 mb-0" role="status" aria-live="polite"></p>
        </section>
      </section>
    </div>
