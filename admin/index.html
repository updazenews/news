<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5731928992880799" crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-5731928992880799" />
  <title>Admin Dashboard | Updaze News</title>
  <meta name="robots" content="noindex,nofollow" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="admin-shell">
  <header class="bg-white border-bottom sticky-top">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">Updaze News Admin Dashboard</h1>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-primary btn-sm" href="/admin/publish.html">Publish Article</a>
        <span id="adminUserLabel" class="small text-muted"></span>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <div id="guardMessage" class="alert alert-warning d-none" role="alert"></div>

    <section class="card admin-panel p-4 mb-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
        <h2 class="h5 mb-0">Published Articles</h2>
        <a class="btn btn-outline-primary btn-sm" href="/admin/publish.html">Go to Publish Page</a>
      </div>
      <p id="publishedArticlesStatus" class="small text-muted mb-3">Loading published articles...</p>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Author</th>
              <th>Published</th>
              <th>Views</th>
              <th>Open</th>
            </tr>
          </thead>
          <tbody id="publishedArticlesBody">
            <tr><td colspan="6" class="text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="../assets/js/publish.js"></script>
</body>
</html>
