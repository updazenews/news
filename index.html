<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Updaze News | Coming Soon</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: #ffffff;
      color: #111827;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .coming-soon-box {
      max-width: 600px;
      padding: 3rem 2.5rem;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      animation: fadeUp 1.2s ease-out;
    }

    .brand {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .divider {
      width: 80px;
      height: 4px;
      background-color: #0d6efd;
      margin: 1.5rem auto;
      border-radius: 2px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #4b5563;
    }

    .tagline {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #6b7280;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container d-flex align-items-center justify-content-center text-center">
    <div class="coming-soon-box">
      <div class="brand">Updaze News</div>
      <div class="divider"></div>
      <p class="subtitle">We are building something fresh, fast, and reliable.</p>
      <h2 class="mt-3">Coming Soon</h2>
      <p class="tagline">
        Breaking stories. Local insights. Real-time updates.
      </p>
    </div>
  </div>

</body>
</html>
